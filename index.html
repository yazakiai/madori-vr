<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>間取りVR</title>
<style>
  :root { --ink: #23272d; --muted: #6b7178; --line: #e3e5e8; --paper: #f5f4f0; --accent: #2f6fb0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 2; }
  #ui.hidden { display: none; }
  .card { width: min(560px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  h1 { margin: 0 0 6px; font-size: 26px; }
  p { margin: 6px 0; line-height: 1.6; color: var(--muted); }
  .step { margin-top: 22px; }
  .step b { display: block; margin-bottom: 8px; font-size: 17px; color: var(--ink); }
  button, label.btn { display: inline-block; font: inherit; font-size: 20px; padding: 16px 26px; border-radius: 14px; border: none; cursor: pointer; background: var(--ink); color: #fff; }
  button:disabled { background: #b9bdc2; cursor: default; }
  label.btn input { display: none; }
  #status { margin-top: 10px; font-size: 16px; color: var(--ink); min-height: 1.6em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .opt { font-size: 16px; color: var(--ink); display: flex; gap: 8px; align-items: center; }
  .opt input { width: 22px; height: 22px; }
  .help { margin-top: 18px; font-size: 14px; line-height: 1.8; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
  #hud { position: fixed; left: 12px; bottom: 12px; z-index: 1; background: rgba(255,255,255,.9); border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--muted); display: none; }
  canvas { display: block; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="ui"><div class="card">
  <h1>間取りVR</h1>
  <p>「間取りスケッチ」の「VR用に書き出す（GLB）」で作ったファイルを、実寸の家として歩き回れます。ファイルはこの端末の中だけで読み込み、どこにも送りません。</p>
  <div class="step"><b>1. 家のファイル（.glb）を選ぶ</b>
    <div class="row"><label class="btn">ファイルを選ぶ<input id="file" type="file" accept=".glb,model/gltf-binary,application/octet-stream"></label></div>
    <div id="status"></div>
  </div>
  <div class="step"><b>2. 家の中に入る</b>
    <div class="row"><button id="enter" disabled>VRで入る</button><button id="flat" disabled>画面で見る</button></div>
    <div class="row" style="margin-top:12px"><label class="opt"><input id="seated" type="checkbox">座って使う（目の高さを足す）</label>
      <label class="opt"><input id="smooth" type="checkbox">なめらかに向きを変える</label></div>
  </div>
  <div class="help">
    <b style="color:var(--ink)">VRでの操作</b><br>
    左スティック：歩く（見ている方へ）／右スティック左右：向きを変える<br>
    右のAボタン：はじめの場所へ戻る／壁にはぶつかります。階段は上り下りできます<br>
    <b style="color:var(--ink)">画面で見るときの操作</b><br>
    W・A・S・D か矢印キー：歩く／ドラッグ：見回す／Esc：最初の画面へ
  </div>
</div></div>
<div id="hud">W・A・S・D で歩く、ドラッグで見回す、Esc で戻る</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);
const status = t => { $('status').textContent = t; };

/* ---- 3Dの土台 ---- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ec);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9a968c, 2.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(6, 12, 8); scene.add(sun);
const rig = new THREE.Group(); scene.add(rig); window.__rig = rig;              // 立っている場所と向き（歩く・回るとこれが動く）
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 400);
rig.add(camera);
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ---- 家のデータ ---- */
let house = null, data = null, level = 0, curY = 0;
const PR = 0.22, SPEED = 1.4, EYE = 1.5;

function inPoly(x, z, P) {
  let c = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const xi = P[i][0], zi = P[i][1], xj = P[j][0], zj = P[j][1];
    if ((zi > z) !== (zj > z) && x < (xj - xi)*(z - zi)/(zj - zi) + xi) c = !c;
  }
  return c;
}
const lv = () => data.levels.find(l => l.level === level) || data.levels[0];
function floorAt(x, z) {
  const L = lv();
  for (const f of L.floors) if (inPoly(x, z, f.p)) return f.y;
  return L.base;
}
/* 階段（アプリと同じ計算）：0＝1階の床、1＝2階の床 */
function stairT(style, W, D, lx, lz) {
  if (Math.abs(lx) > W/2 || Math.abs(lz) > D/2) return null;
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  if (style === 'u') {
    const land = Math.min(W/2, D*0.4), run = D - land;
    if (lz <= -D/2 + land) return 0.45 + 0.1*cl((W/2 - lx)/W, 0, 1);
    return lx >= 0 ? 0.45*(D/2 - lz)/run : 0.55 + 0.45*(lz - (-D/2 + land))/run;
  }
  if (style === 'l') {
    const w0 = Math.min(0.9, Math.min(W, D)/2);
    if (lx > W/2 - w0) return lz > -D/2 + w0 ? 0.5*(D/2 - lz)/(D - w0) : 0.5;
    return lz <= -D/2 + w0 ? 0.5 + 0.5*((W/2 - w0) - lx)/(W - w0) : null;
  }
  return cl((D/2 - lz)/D, 0, 1);
}
function stairHeight(x, z) {
  for (const s of data.stairs || []) {
    const dx = x - s.cx, dz = z - s.cz;
    const lx = dx*Math.cos(s.rot) + dz*Math.sin(s.rot), lz = -dx*Math.sin(s.rot) + dz*Math.cos(s.rot);
    const t = stairT(s.style, s.W, s.D, lx, lz);
    if (t !== null) return t*s.rise;
  }
  return null;
}
/* 壁との当たり判定（円と線分。アプリと同じ） */
function collide(x0, z0) {
  let px = x0, pz = z0;
  const segs = lv().walls;
  for (let it = 0; it < 4; it++) for (const s of segs) {
    const ax = s[0], az = s[1], dx = s[2] - ax, dz = s[3] - az, L2 = dx*dx + dz*dz;
    let t = L2 ? ((px - ax)*dx + (pz - az)*dz)/L2 : 0; t = Math.max(0, Math.min(1, t));
    const qx = ax + t*dx, qz = az + t*dz, ex = px - qx, ez = pz - qz, d = Math.hypot(ex, ez), mn = PR + s[4];
    if (d < mn) {
      if (d < 1e-6) { const l = Math.sqrt(L2) || 1; px = qx - dz/l*mn; pz = qz + dx/l*mn; }
      else { px = qx + ex/d*mn; pz = qz + ez/d*mn; }
    }
  }
  return [px, pz];
}

/* ---- ファイルを読む ---- */
$('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) load(f.name, f.size, () => f.arrayBuffer()); });
// ?src=ファイル名 で、同じ場所に置いたファイルを読む（確認用）
const src = new URLSearchParams(location.search).get('src');
if (src) load(src, 0, () => fetch(src).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }));
async function load(name, size, read) {
  const f = { name };
  status('読み込み中…' + (size ? '（' + (size/1e6).toFixed(1) + 'MB）' : ''));
  $('enter').disabled = $('flat').disabled = true;
  try {
    const buf = await read();
    const gltf = await new Promise((ok, ng) => new GLTFLoader().parse(buf, '', ok, ng));
    if (house) scene.remove(house);
    house = gltf.scene; scene.add(house);
    data = (gltf.parser.json.extras || {}).madori || null;
    if (!data) {
      // 歩くためのデータが無いファイル：家の外側から見るだけ
      const b = new THREE.Box3().setFromObject(house), c = b.getCenter(new THREE.Vector3());
      data = { levels: [{ level: 0, y: 0, base: b.min.y, walls: [], floors: [] }], stairs: [], spawn: [c.x, b.max.z + 3, 0] };
      status('読み込みました（古い書き出し方のファイルなので、壁の当たり判定はありません）');
    } else status('読み込みました：' + (data.name || f.name));
    $('enter').disabled = !navigator.xr; $('flat').disabled = false;
    if (!navigator.xr) status($('status').textContent + '／この画面ではVRが使えません（Quest のブラウザで開いてください）');
    else navigator.xr.isSessionSupported('immersive-vr').then(ok => { if (!ok) { $('enter').disabled = true; status($('status').textContent + '／VRに対応していない画面です'); } });
    spawn();
  } catch (err) { status('読み込めませんでした：' + err.message); }
}

/* はじめの場所に立つ */
function spawn() {
  level = 0;
  const [x, z, yaw] = data.spawn;
  rig.rotation.set(0, yaw, 0);
  curY = floorAt(x, z);
  placeHead(x, z);
  look.yaw = 0; look.pitch = 0;
}
/* 頭（カメラ）の位置が x,z になるように rig を動かす */
const tmpV = new THREE.Vector3();
function headXZ() { camera.getWorldPosition(tmpV); return [tmpV.x, tmpV.z]; }
function placeHead(x, z) {
  rig.updateMatrixWorld(true);
  const [hx, hz] = headXZ();
  rig.position.x += x - hx; rig.position.z += z - hz;
}

/* ---- VRに入る ---- */
$('enter').addEventListener('click', async () => {
  try {
    const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] });
    renderer.xr.setFoveation(1);
    await renderer.xr.setSession(s);
    $('ui').classList.add('hidden');
    camera.position.set(0, 0, 0); camera.rotation.set(0, 0, 0);
    spawn();
    s.addEventListener('end', () => $('ui').classList.remove('hidden'));
  } catch (err) { status('VRに入れませんでした：' + err.message); }
});
/* ---- 画面で見る（Mac・Quest の平らな画面） ---- */
const look = { yaw: 0, pitch: 0 };
let flat = false;
$('flat').addEventListener('click', () => {
  flat = true; $('ui').classList.add('hidden'); $('hud').style.display = 'block';
  spawn();
});
const keys = new Set();
addEventListener('keydown', e => {
  if (e.key === 'Escape' && flat) { flat = false; $('ui').classList.remove('hidden'); $('hud').style.display = 'none'; return; }
  keys.add(e.key.toLowerCase());
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', e => {
  if (!drag || !flat) return;
  look.yaw -= (e.clientX - drag[0])*0.004; look.pitch = Math.max(-1.3, Math.min(1.3, look.pitch - (e.clientY - drag[1])*0.004));
  drag = [e.clientX, e.clientY];
});

/* ---- 毎フレーム ---- */
let snapReady = true, aWas = false, last = performance.now();
const fwd = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last)/1000); last = now;
  if (!data) { renderer.render(scene, camera); return; }
  const xr = renderer.xr.isPresenting;
  let mx = 0, mz = 0, turn = 0, reset = false;
  if (xr) {
    for (const src of renderer.xr.getSession().inputSources) {
      const gp = src.gamepad; if (!gp) continue;
      const ax = gp.axes.length >= 4 ? gp.axes[2] : gp.axes[0] || 0, ay = gp.axes.length >= 4 ? gp.axes[3] : gp.axes[1] || 0;
      if (src.handedness === 'left') { mx = Math.abs(ax) > 0.15 ? ax : 0; mz = Math.abs(ay) > 0.15 ? ay : 0; }
      if (src.handedness === 'right') { turn = Math.abs(ax) > 0.15 ? ax : 0; if (gp.buttons[4]) reset = gp.buttons[4].pressed; }
    }
  } else if (flat) {
    if (keys.has('w') || keys.has('arrowup')) mz -= 1;
    if (keys.has('s') || keys.has('arrowdown')) mz += 1;
    if (keys.has('a')) mx -= 1;
    if (keys.has('d')) mx += 1;
    if (keys.has('arrowleft')) look.yaw += dt*1.8;
    if (keys.has('arrowright')) look.yaw -= dt*1.8;
    camera.position.set(0, EYE, 0);
    camera.rotation.set(look.pitch, look.yaw, 0, 'YXZ');
  }
  if (reset && !aWas) spawn();
  aWas = reset;
  // 向きを変える（右スティック）。頭の位置を軸に回す
  if (turn) {
    const smooth = $('smooth').checked;
    let da = 0;
    if (smooth) da = -turn*dt*2.0;
    else if (snapReady && Math.abs(turn) > 0.7) { da = -Math.sign(turn)*Math.PI/6; snapReady = false; }
    if (da) { rig.updateMatrixWorld(true); const [hx, hz] = headXZ(); rig.rotation.y += da; placeHead(hx, hz); }
  }
  if (Math.abs(turn) < 0.3) snapReady = true;
  // 歩く：見ている方向（水平）に進む。壁で止まる
  rig.updateMatrixWorld(true);
  const [hx, hz] = headXZ();
  if (mx || mz) {
    camera.getWorldDirection(fwd); fwd.y = 0; if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, -1); fwd.normalize();
    const rx = -fwd.z, rz = fwd.x, l = Math.max(1, Math.hypot(mx, mz)), sp = SPEED*dt/l;
    const tx = hx + (fwd.x*-mz + rx*mx)*sp, tz = hz + (fwd.z*-mz + rz*mx)*sp;
    const [cx, cz] = collide(tx, tz);
    rig.position.x += cx - hx; rig.position.z += cz - hz;
  }
  // 床の高さ（段差・階段・2階）
  const [px, pz] = headXZ();
  let target = floorAt(px, pz);
  const sh = stairHeight(px, pz);
  if (sh !== null && data.levels.length > 1) {
    target = sh;
    if (level === 0 && sh > data.floorStep - 0.25) level = 1;
    else if (level === 1 && sh < data.floorStep - 0.6) level = 0;
  } else if (sh !== null) target = sh;
  curY += (target - curY)*Math.min(1, dt*8);
  rig.position.y = curY + (xr && $('seated').checked ? 0.45 : 0);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
